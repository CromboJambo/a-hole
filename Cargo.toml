[package]
name = "a-hole"
version = "0.0.1"
edition = "2021"
description = "A Pi-hole for developer attention — mirrors telemetry and tracks config diffs as earned knowledge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CromboJambo/a-hole"
keywords = ["attention", "telemetry", "config", "observer", "nushell"]
categories = ["command-line-utilities", "development-tools"]
[dependencies]
notify = "6.1"
rusqlite = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_ini = "0.2"
tokio = { version = "1.40", features = ["full"] }
nu-protocol = "0.100"
nu-cli = "0.100"
nu-engine = "0.100"
nu-path = "0.100"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
[dev-dependencies]
tempfile = "3.14"
